name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository security checks
        run: python scripts/security_check.py
      - name: Static analysis of Python scripts (bandit)
        run: |
          python -m pip install --upgrade pip
          pip install bandit
          bandit -r scripts -ll
