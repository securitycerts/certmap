name: Validate data

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate certs.csv
        run: node scripts/validate.mjs
