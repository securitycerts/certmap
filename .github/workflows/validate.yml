name: Validate data

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate.mjs"
      - "scripts/build-pages.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate certs.csv
        run: node scripts/validate.mjs
      - name: Generated pages are up to date
        run: |
          node scripts/build-pages.mjs
          git add -N certs
          git diff --exit-code -- certs sitemap.xml index.html llms.txt || { echo "Run 'npm run build' and commit the result."; exit 1; }
