name: Refresh exchange rates

# Prices that issuers publish in GBP or EUR are converted to USD with the
# European Central Bank reference rates from the public Frankfurter API.
# Once a day this refreshes the rates, rebuilds the pages and commits the
# result if any converted price changed.
on:
  schedule:
    - cron: "17 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch rates and convert prices
        run: node scripts/rates.mjs
      - name: Rebuild pages
        run: node scripts/validate.mjs && node scripts/build-pages.mjs
      - name: Commit if anything changed
        run: |
          git diff --quiet && exit 0
          git config user.name "securitycerts"
          git config user.email "securitycerts@users.noreply.github.com"
          git add -A
          git commit -m "Refresh exchange rates ($(node -p "require('./data/rates.json').date"))"
          git push
